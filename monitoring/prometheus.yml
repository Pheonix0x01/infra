global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:8000']
    
  - job_name: 'templates-service'
    static_configs:
      - targets: ['templates-service:8080']
    
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8090']
    
  - job_name: 'push-service'
    static_configs:
      - targets: ['push-service:8500']